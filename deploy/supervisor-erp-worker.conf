# /etc/supervisor/conf.d/erp-worker.conf
# Only needed when the daily-attendance rebuild runs on a queue
# (QUEUE_CONNECTION=database and ZKTECO_QUEUE_CONNECTION not set to sync).
#   sudo apt install supervisor
#   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status

[program:erp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/erp/artisan queue:work --queue=default --sleep=3 --tries=5 --max-time=3600
directory=/var/www/erp
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/erp/storage/logs/worker.log
