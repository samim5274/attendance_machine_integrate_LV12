# /etc/nginx/sites-available/erp  ->  sudo ln -s /etc/nginx/sites-available/erp /etc/nginx/sites-enabled/
# Serves the Laravel ERP on the hospital LAN. The ZKTeco terminal talks to /iclock/* on this port.
# Check:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;                      # = "Server Port" on the device (use e.g. 8081 if 80 is taken)
    server_name _;
    root /var/www/erp/public;       # <- your Laravel project's public/ folder
    index index.php;

    charset utf-8;
    client_max_body_size 20m;       # bulk log uploads from the device can be several MB

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Device endpoints: keep them out of the access log noise (one poll every ~10 s).
    location ^~ /iclock/ {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # <- match your PHP version (ls /run/php/)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
